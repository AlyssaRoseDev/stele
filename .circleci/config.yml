version: 2.1
orbs:
  codecov: codecov/codecov@6.0.0
jobs:
  build:
    docker: 
      - image: &img cimg/rust:1.55
    steps:
      - checkout
      - run: cargo build
  test:
    docker:
      - image: *img
    steps:
      - checkout
      - run:
          name: Tests
          command: cargo test --all-targets
  miri:
    docker:
      - image: *img
    resource_class: large
    steps:
      - checkout
      - run: rustup install nightly
      - run: rustup component add miri --toolchain nightly
      - run:
          name: Tests
          command: cargo +nightly miri test
      - run:
          name: Allocator Tests
          command: cargo +nightly miri test --all-targets
  nightly_test:
    docker:
      - image: *img
    steps:
      - checkout
      - run: rustup install nightly
      - run:
          name: Nightly Tests
          command: cargo +nightly test --all-targets --all-features
  loom:
    docker:
      - image: *img
    resource_class: large
    steps:
      - checkout
      - run: rustup install nightly
      - run:
          name: Loom
          command: RUSTFLAGS="--cfg loom" cargo +nightly test --all-targets --release
  checks:
    docker:
      - image: cimg/rust:1.96
    steps:
      - checkout
      - run: rustup install nightly 
      - run: cargo +nightly install cargo-msrv
      - run: cargo +nightly msrv verify
      - run: cargo clippy
      - run:
          name: cargo doc
          command: cargo +nightly doc --no-deps
      - run:
          name: no_std
          command: cargo test --no-default-features
      - run: cargo fmt --check
    parallelism: 3
  coverage:
    docker:
      - image: cimg/rust:1.96
    resource_class: large
    steps:
      - checkout
      - run: rustup install nightly
      - run: rustup component add llvm-tools-preview --toolchain nightly
      - run: cargo +nightly install cargo-llvm-cov
      - run: cargo +nightly llvm-cov --no-report
      - run: cargo +nightly llvm-cov --all-features
      - run: cargo +nightly llvm-cov report --lcov --output-path lcov.info
      - codecov/upload
workflows:
  full:
    jobs:
      - build
      - test
      - miri
      - loom
      - checks
      - coverage:
          context: CODECOV_TOKEN